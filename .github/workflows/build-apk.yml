name: Build Standalone Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35' 'build-tools;35.0.0' 'platforms;android-34' 'build-tools;34.0.0'

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🏗️ Run Expo Prebuild
        run: npx expo prebuild --platform android

      - name: ⚙️ Adjust Android SDK compile target version
        run: |
          sed -i "s/compileSdkVersion = 35/compileSdkVersion = 34/g" android/build.gradle || true
          sed -i "s/35.0.0/34.0.0/g" android/build.gradle || true

      - name: 🔨 Compile Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 📤 Upload Standalone APK File
        uses: actions/upload-artifact@v4
        with:
          name: Blossom-Like-A-Flower-Android-APK
          path: android/app/build/outputs/apk/release/*.apk
